{type:"multi",q:"76.属于演出经纪机构设立条件的有( )",opts:["A.名称","B.住所","C.3名经纪人员","D.资金"],ans:"ABCD",explain:"均为设立必备条件。"},
{type:"multi",q:"77.演员义务包括( )",opts:["A.按约演出","B.保证质量","C.配合安全","D.拒绝演出"],ans:"ABC",explain:"无正当理由不得拒绝演出。"},
{type:"multi",q:"78.属于演出场所备案材料的有( )",opts:["A.执照","B.消防","C.安全","D.演员名单"],ans:"ABC",explain:"演员名单不属于备案材料。"},
{type:"multi",q:"79.禁止向未成年人出售( )演出门票",opts:["A.恐怖","B.暴力","C.色情","D.儿童剧"],ans:"ABC",explain:"儿童剧是合法的。"},
{type:"multi",q:"80.演出结束工作包括( )",opts:["A.疏散观众","B.设备检查","C.垃圾清理","D.立即拆台"],ans:"ABC",explain:"不得违规立即拆台。"},
{type:"judge",q:"81.演出经纪人员可以同时在两家演出经纪机构从业",opts:[],ans:"错",explain:"只能在一家机构从业。"},
{type:"judge",q:"82.营业性演出可以不经过审批直接举办",opts:[],ans:"错",explain:"营业性演出必须审批。"},
{type:"judge",q:"83.演出场所应当对演出内容进行核实",opts:[],ans:"对",explain:"场所负有内容核实义务。"},
{type:"judge",q:"84.临时搭建舞台不需要安全检测",opts:[],ans:"错",explain:"必须检测合格才能使用。"},
{type:"judge",q:"85.票务可以随意加价倒卖",opts:[],ans:"错",explain:"严禁加价倒卖。"},
{type:"judge",q:"86.演出广告可以夸大宣传",opts:[],ans:"错",explain:"广告必须真实合法。"},
{type:"judge",q:"87.个体演出经纪人可以举办组台演出",opts:[],ans:"错",explain:"个体不能举办组台演出。"},
{type:"judge",q:"88.演出内容不得危害国家统一",opts:[],ans:"对",explain:"这是法定禁止内容。"},
{type:"judge",q:"89.消防安全通道可以临时占用",opts:[],ans:"错",explain:"严禁占用消防通道。"},
{type:"judge",q:"90.演出经纪人员资格证需要年检",opts:[],ans:"错",explain:"资格证长期有效无需年检。"},
{type:"judge",q:"91.涉外演出必须经省级文旅部门批准",opts:[],ans:"对",explain:"涉外演出审批权限在省级。"},
{type:"judge",q:"92.假唱、假演奏是允许的",opts:[],ans:"错",explain:"假唱假演奏属于违规行为。"},
{type:"judge",q:"93.演出举办单位应当制定应急预案",opts:[],ans:"对",explain:"应急预案是法定要求。"},
{type:"judge",q:"94.演出备案可以随意变更",opts:[],ans:"错",explain:"备案变更需重新备案。"},
{type:"judge",q:"95.以未成年人为对象的演出不得含有色情内容",opts:[],ans:"对",explain:"严格保护未成年人。"},
{type:"judge",q:"96.演出场所对现场安全负主体责任",opts:[],ans:"对",explain:"场所是安全第一责任人。"},
{type:"judge",q:"97.演出合同可以口头约定",opts:[],ans:"错",explain:"必须签订书面合同。"},
{type:"judge",q:"98.大型群众性活动需提前20日申请安全许可",opts:[],ans:"对",explain:"符合条例规定。"},
{type:"judge",q:"99.演出记录需要保存60日备查",opts:[],ans:"对",explain:"法定保存期限60日。"},
{type:"judge",q:"100.所有演出都必须明码标价售票",opts:[],ans:"对",explain:"票务必须明码标价。"}
];

let cur=0,ansShown=false,userAns={},res={},score=0;

function initNav(){
  const nav=document.getElementById('nav');nav.innerHTML='';
  questions.forEach((_,i)=>{
    const d=document.createElement('div');d.className='navitem';d.innerText=i+1;d.onclick=()=>jump(i);nav.appendChild(d);
  });
}
function updateNav(){
  document.querySelectorAll('.navitem').forEach((e,i)=>{
    e.classList.remove('active','right','wrong');
    if(i===cur)e.classList.add('active');
    if(res[i]===true)e.classList.add('right');
    if(res[i]===false)e.classList.add('wrong');
  });
}
function render(){
  ansShown=false;const q=questions[cur];
  document.getElementById('qnum').innerText=`第 ${cur+1} 题（${q.type==='single'?'单选':q.type==='multi'?'多选':'判断'}）`;
  document.getElementById('qtext').innerText=q.q;
  document.getElementById('answer').style.display='none';
  document.getElementById('sub').disabled=false;document.getElementById('next').disabled=true;
  let h='';
  if(q.type==='single')q.opts.forEach(o=>{const v=o[0];const c=userAns[cur]===v?'checked':'';h+=`<label class="opt"><input type="radio" name="a" value="${v}" ${c}> ${o}</label>`});
  if(q.type==='multi')q.opts.forEach(o=>{const v=o[0];const c=(userAns[cur]||[]).includes(v)?'checked':'';h+=`<label class="opt"><input type="checkbox" name="a" value="${v}" ${c}> ${o}</label>`});
  if(q.type==='judge')h+=`<label class="opt"><input type="radio" name="a" value="对" ${userAns[cur]==='对'?'checked':''}> 对</label><label class="opt"><input type="radio" name="a" value="错" ${userAns[cur]==='错'?'checked':''}> 错</label>`;
  document.getElementById('opts').innerHTML=h;updateNav();
}
function submit(){
  if(ansShown)return;const q=questions[cur];let a;
  if(q.type==='single'||q.type==='judge'){const s=document.querySelector('input[name="a"]:checked');if(!s)return alert('请选择答案');a=s.value}
  if(q.type==='multi'){const s=document.querySelectorAll('input[name="a"]:checked');if(s.length===0)return alert('请选择答案');a=Array.from(s).map(i=>i.value).sort().join('');q.ans=q.ans.split('').sort().join('')}
  ansShown=true;userAns[cur]=a;const ok=a===q.ans;res[cur]=ok;score=Object.values(res).filter(Boolean).length;
  document.getElementById('correct').innerText=`正确答案：${q.ans}`;
  document.getElementById('correct').style.color=ok?'#27ae60':'#e74c3c';
  document.getElementById('explain').innerText=q.explain;
  document.getElementById('answer').style.display='block';
  document.getElementById('sub').disabled=true;document.getElementById('next').disabled=false;updateNav();
}
function next(){cur<questions.length-1?(cur++,render()):finish()}
function prev(){if(cur>0){cur--;render()}}
function jump(i){cur=i;render()}
function finish(){document.getElementById('score').style.display='block';document.getElementById('score').innerText=`✅ 完成！得分：${score}/${questions.length}`;document.getElementById('prev').disabled=true;document.getElementById('next').disabled=true}

initNav();render();
</script>
</body>
</html>
